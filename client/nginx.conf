server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: let React Router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it would
    # otherwise fall back to application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Forward API calls to the server container (see docker-compose.yml).
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
