<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Day Story — Run Your Day</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #2B2140;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---- Input screen ---- */
  #inputScreen {
    flex: 1; display: flex; flex-direction: column; padding: 20px 18px;
    background: #FFF8EC; color: #3F2B1D;
  }
  #inputScreen h1 {
    font-family: Georgia, serif; font-size: 24px; margin: 4px 0 2px; font-weight: 700;
  }
  #inputScreen p { margin: 0 0 16px; font-size: 14px; color: #7A5A42; }
  #dayText {
    width: 100%; min-height: 110px; border: 1.5px solid #E8D2B0; border-radius: 12px;
    padding: 12px 14px; font-size: 14.5px; font-family: inherit; resize: vertical;
    background: #FFFEFB; color: #3F2B1D;
  }
  #buildBtn {
    margin-top: 14px; border: none; border-radius: 10px; padding: 13px 18px;
    background: #C1502E; color: #FFF8EC; font-weight: 700; font-size: 15px;
    cursor: pointer;
  }
  #buildBtn:disabled { background: #E8D2B0; }
  #hint { margin-top: 10px; font-size: 12.5px; color: #B0703F; line-height: 1.5; }

  /* ---- Game screen ---- */
  #gameScreen { display: none; flex: 1; flex-direction: column; background: #2B2140; }
  #hud {
    display: flex; gap: 6px; padding: 10px 10px 6px; overflow-x: auto;
    background: #201936;
  }
  .badge {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; opacity: 0.35; border: 2px solid rgba(255,255,255,0.15);
    transition: opacity 0.2s, transform 0.2s;
  }
  .badge.got { opacity: 1; transform: scale(1.08); border-color: rgba(255,255,255,0.6); }

  #canvasWrap { flex: 1; position: relative; background: #2B2140; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

  #popup {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s, top 0.3s; pointer-events: none;
  }
  #popup.show { opacity: 1; top: 26px; }

  #controls {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px 22px; background: #201936; gap: 12px;
  }
  .ctrlBtn {
    border: none; border-radius: 14px; background: #3A2E56; color: #E8D2B0;
    font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    width: 58px; height: 52px; touch-action: none;
  }
  .ctrlBtn:active { background: #C1502E; color: #fff; }
  #jumpBtn { width: 84px; height: 60px; border-radius: 30px; font-size: 15px; }
  #dpad { display: flex; gap: 8px; }

  /* ---- Complete overlay ---- */
  #completeOverlay {
    display: none; position: absolute; inset: 0; background: rgba(20,14,32,0.92);
    color: #FFF8EC; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #completeOverlay h2 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 6px; }
  #completeOverlay p { font-size: 14.5px; color: #E8D2B0; max-width: 320px; line-height: 1.5; margin: 0 0 16px; }
  #badgeRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; max-width: 340px; }
  #badgeRow .cbadge {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 16px; border: 2px solid rgba(255,255,255,0.4);
  }
  .endBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .endBtn {
    border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }
  #saveBtn { background: #C1502E; color: #fff; }
  #againBtn { background: transparent; color: #E8D2B0; border: 1.5px solid #E8D2B0; }
  #saveBtn:disabled { opacity: 0.6; }
</style>
</head>
<body>
<div id="app">

  <div id="inputScreen">
    <h1>Day Story: Run Your Day</h1>
    <p>Write what you did today. It becomes a level — run, jump, and collect it in a couple minutes.</p>
    <textarea id="dayText" placeholder="e.g. Went to the gym in the morning, had a work meeting, cooked dinner with my kids, then watched a movie..."></textarea>
    <button id="buildBtn" disabled>Build My Level</button>
    <div id="hint">Tip: mention things like work, gym, food, family, study, sleep, music, travel, friends — each becomes a collectible in the level.</div>
  </div>

  <div id="gameScreen">
    <div id="hud"></div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="popup"></div>
      <div id="completeOverlay">
        <h2>Day Complete!</h2>
        <p id="summaryText"></p>
        <div id="badgeRow"></div>
        <div class="endBtns">
          <button class="endBtn" id="saveBtn">Save This Day</button>
          <button class="endBtn" id="againBtn">Play Again</button>
        </div>
      </div>
    </div>
    <div id="controls">
      <div id="dpad">
        <button class="ctrlBtn" id="leftBtn">◀</button>
        <button class="ctrlBtn" id="rightBtn">▶</button>
      </div>
      <button class="ctrlBtn" id="jumpBtn">JUMP</button>
    </div>
  </div>

</div>

<script>
// ---------------- Activity dictionary ----------------
const ACTIVITIES = [
  { key: "work", label: "Work", color: "#3F5B6B", emoji: "💼", words: ["work","office","meeting","email","project","boss","client","deadline"] },
  { key: "code", label: "Coded", color: "#5B7B9A", emoji: "💻", words: ["code","coding","programming","bug","debug","developed"] },
  { key: "gym", label: "Gym", color: "#C1502E", emoji: "🏋️", words: ["gym","workout","exercise","lift","weights","run","running","jog"] },
  { key: "food", label: "Food", color: "#E8A03D", emoji: "🍽️", words: ["ate","food","lunch","dinner","breakfast","cooked","cooking","restaurant","meal"] },
  { key: "family", label: "Family", color: "#B5566B", emoji: "👨‍👩‍👧", words: ["family","kids","children","mom","dad","parents","son","daughter","wife","husband"] },
  { key: "friends", label: "Friends", color: "#5A8F6F", emoji: "🧑‍🤝‍🧑", words: ["friend","friends","hangout","party","chat"] },
  { key: "study", label: "Study", color: "#7A5FA0", emoji: "📚", words: ["study","studied","read","reading","book","learned","class","course"] },
  { key: "sleep", label: "Rest", color: "#2E3A59", emoji: "🌙", words: ["sleep","slept","nap","tired","rest","bed"] },
  { key: "music", label: "Music", color: "#D4715B", emoji: "🎵", words: ["music","song","guitar","sang","concert","listened"] },
  { key: "travel", label: "Travel", color: "#4E8A8A", emoji: "🚗", words: ["travel","drive","drove","trip","flight","airport","car"] },
  { key: "movie", label: "Movie", color: "#8C5B9A", emoji: "🎬", words: ["movie","film","watched","netflix","show"] },
  { key: "walk", label: "Walk", color: "#6B9B6E", emoji: "🚶", words: ["walk","walked","stroll","park"] },
  { key: "shopping", label: "Shopping", color: "#C97BAE", emoji: "🛍️", words: ["shopping","shop","bought","store","market"] },
  { key: "clean", label: "Clean", color: "#7FA6A0", emoji: "🧹", words: ["clean","cleaned","laundry","dishes","chores"] },
  { key: "coffee", label: "Coffee", color: "#8B5E3C", emoji: "☕", words: ["coffee","tea","cafe"] },
];

function detectActivities(text) {
  const lower = text.toLowerCase();
  const found = [];
  for (const act of ACTIVITIES) {
    if (act.words.some(w => lower.includes(w))) found.push(act);
  }
  return found.length ? found : [ACTIVITIES[0]]; // always give at least one station
}

function buildSummary(acts) {
  const labels = acts.map(a => a.label.toLowerCase());
  let phrase;
  if (labels.length === 1) phrase = labels[0];
  else if (labels.length === 2) phrase = `${labels[0]} and ${labels[1]}`;
  else phrase = `${labels.slice(0,-1).join(", ")}, and ${labels[labels.length-1]}`;
  return `You ran through a day of ${phrase}. Every stop was something you actually did today.`;
}

// ---------------- DOM refs ----------------
const dayText = document.getElementById('dayText');
const buildBtn = document.getElementById('buildBtn');
const inputScreen = document.getElementById('inputScreen');
const gameScreen = document.getElementById('gameScreen');
const hud = document.getElementById('hud');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const popupEl = document.getElementById('popup');
const completeOverlay = document.getElementById('completeOverlay');
const summaryText = document.getElementById('summaryText');
const badgeRow = document.getElementById('badgeRow');
const saveBtn = document.getElementById('saveBtn');
const againBtn = document.getElementById('againBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const jumpBtn = document.getElementById('jumpBtn');

dayText.addEventListener('input', () => {
  buildBtn.disabled = dayText.value.trim().length === 0;
});

// ---------------- Game state ----------------
let level = null;
let player = null;
let camX = 0;
let input = { left: false, right: false };
let running = false;
let currentActivities = [];
let currentText = "";
let rafId = null;

const GROUND_Y = 200;
const GRAVITY = 0.6;
const MOVE_SPEED = 2.6;
const JUMP_VELOCITY = -10.5;

function buildLevel(activities) {
  const segments = [];
  const coins = [];
  let x = 40;
  activities.forEach((act, i) => {
    if (i > 0) {
      const gap = 70 + Math.random() * 40;
      x += gap;
    }
    const segLen = 260 + Math.random() * 90;
    segments.push({ x1: x, x2: x + segLen });
    coins.push({ x: x + 70, y: GROUND_Y - 78, r: 14, act, collected: false, bob: Math.random() * 10 });
    x += segLen;
  });
  const finalLen = 260;
  segments.push({ x1: x, x2: x + finalLen });
  const flagX = x + finalLen - 40;
  const levelWidth = x + finalLen + 60;
  return { segments, coins, flagX, levelWidth };
}

function solidAt(px) {
  for (const s of level.segments) {
    if (px >= s.x1 && px <= s.x2) return s;
  }
  return null;
}

function resetPlayer() {
  const firstSeg = level.segments[0];
  player = {
    x: firstSeg.x1 + 30, y: GROUND_Y - 34, w: 22, h: 34,
    vx: 0, vy: 0, onGround: true, checkpoint: firstSeg.x1 + 30, facing: 1
  };
}

function startGame() {
  currentText = dayText.value.trim();
  currentActivities = detectActivities(currentText);
  level = buildLevel(currentActivities);
  resetPlayer();
  camX = 0;
  running = true;

  hud.innerHTML = '';
  currentActivities.forEach(act => {
    const b = document.createElement('div');
    b.className = 'badge';
    b.id = 'hud-' + act.key + '-' + Math.random().toString(36).slice(2,6);
    b.dataset.key = act.key;
    b.textContent = act.emoji;
    hud.appendChild(b);
  });

  inputScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  completeOverlay.style.display = 'none';
  resizeCanvas();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const rect = wrap.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  canvas.__cssW = rect.width;
  canvas.__cssH = rect.height;
}
window.addEventListener('resize', resizeCanvas);

function showPopup(msg) {
  popupEl.textContent = msg;
  popupEl.classList.add('show');
  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => popupEl.classList.remove('show'), 1100);
}

function markBadgeGot(key) {
  const b = hud.querySelector('.badge[data-key="' + key + '"]');
  if (b) b.classList.add('got');
}

function update(dt) {
  // horizontal movement
  player.vx = 0;
  if (input.left) { player.vx = -MOVE_SPEED; player.facing = -1; }
  if (input.right) { player.vx = MOVE_SPEED; player.facing = 1; }
  player.x += player.vx * dt;
  if (player.x < 10) player.x = 10;

  // gravity
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  const seg = solidAt(player.x);
  if (seg) {
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.checkpoint = seg.x1 + 20;
    }
  } else {
    player.onGround = false;
  }

  // fell into a pit
  if (player.y > GROUND_Y + 160) {
    player.x = player.checkpoint;
    player.y = GROUND_Y - player.h;
    player.vx = 0; player.vy = 0;
    player.onGround = true;
    showPopup("Oops — try that jump again");
  }

  // coins
  level.coins.forEach(c => {
    if (!c.collected) {
      const dx = (player.x + player.w/2) - c.x;
      const dy = (player.y + player.h/2) - c.y;
      if (Math.sqrt(dx*dx + dy*dy) < c.r + 18) {
        c.collected = true;
        showPopup(c.act.emoji + " " + c.act.label);
        markBadgeGot(c.act.key);
      }
    }
  });

  // flag / finish
  if (player.x >= level.flagX && running) {
    running = false;
    finishGame();
  }

  // camera
  const viewW = canvas.__cssW || 400;
  camX = Math.max(0, Math.min(player.x - viewW * 0.4, level.levelWidth - viewW));
}

function draw() {
  const w = canvas.__cssW || 400;
  const h = canvas.__cssH || 240;
  const scale = window.devicePixelRatio || 1;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // sky
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#4A3B6B');
  grad.addColorStop(1, '#1E1732');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 25; i++) {
    const sx = (i * 137 - camX * 0.3) % (w + 40);
    const sy = (i * 53) % (h * 0.5);
    ctx.fillRect(((sx % (w+40)) + (w+40)) % (w+40), sy, 2, 2);
  }

  ctx.save();
  ctx.translate(-camX, 0);

  // ground segments
  level.segments.forEach(s => {
    ctx.fillStyle = '#5C8F5A';
    ctx.fillRect(s.x1, GROUND_Y, s.x2 - s.x1, 10);
    ctx.fillStyle = '#3F6B42';
    ctx.fillRect(s.x1, GROUND_Y + 10, s.x2 - s.x1, h - GROUND_Y - 10);
  });

  // coins
  const t = performance.now() / 300;
  level.coins.forEach(c => {
    if (c.collected) return;
    const bobY = c.y + Math.sin(t + c.bob) * 4;
    ctx.beginPath();
    ctx.arc(c.x, bobY, c.r, 0, Math.PI * 2);
    ctx.fillStyle = c.act.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#FFF8EC';
    ctx.stroke();
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.act.emoji, c.x, bobY + 1);
  });

  // flag
  ctx.fillStyle = '#E8D2B0';
  ctx.fillRect(level.flagX, GROUND_Y - 90, 4, 90);
  ctx.beginPath();
  ctx.moveTo(level.flagX + 4, GROUND_Y - 90);
  ctx.lineTo(level.flagX + 34, GROUND_Y - 80);
  ctx.lineTo(level.flagX + 4, GROUND_Y - 70);
  ctx.closePath();
  ctx.fillStyle = '#C1502E';
  ctx.fill();

  // player
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.scale(player.facing, 1);
  ctx.fillStyle = '#C1502E';
  ctx.fillRect(-player.w/2, -player.h/2 + 8, player.w, player.h - 8);
  ctx.fillStyle = '#F3D9B1';
  ctx.beginPath();
  ctx.arc(0, -player.h/2 + 4, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3F2B1D';
  ctx.fillRect(2, -player.h/2 + 1, 4, 3);
  ctx.restore();

  ctx.restore();
}

let lastTime = null;
function loop(ts) {
  if (lastTime == null) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 16.6667, 2.5);
  lastTime = ts;
  update(dt);
  draw();
  if (running) rafId = requestAnimationFrame(loop);
}

function finishGame() {
  const collected = level.coins.filter(c => c.collected).map(c => c.act);
  const acts = collected.length ? collected : currentActivities;
  summaryText.textContent = buildSummary(acts);
  badgeRow.innerHTML = '';
  acts.forEach(a => {
    const b = document.createElement('div');
    b.className = 'cbadge';
    b.style.background = a.color;
    b.textContent = a.emoji;
    badgeRow.appendChild(b);
  });
  completeOverlay.style.display = 'flex';
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save This Day';
}

// ---------------- Controls ----------------
function bindHold(el, onDown, onUp) {
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); onUp(); }, { passive: false });
  el.addEventListener('mousedown', onDown);
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}
bindHold(leftBtn, () => input.left = true, () => input.left = false);
bindHold(rightBtn, () => input.right = true, () => input.right = false);
jumpBtn.addEventListener('click', doJump);
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, { passive: false });
function doJump() {
  if (player && player.onGround) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
  }
}
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'ArrowRight') input.right = true;
  if (e.key === ' ' || e.key === 'ArrowUp') doJump();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'ArrowRight') input.right = false;
});

// ---------------- Buttons ----------------
buildBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', () => {
  inputScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  if (rafId) cancelAnimationFrame(rafId);
});
saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  try {
    const iso = new Date().toISOString().slice(0, 10);
    const acts = level.coins.filter(c => c.collected).map(c => c.act.key);
    const entry = {
      text: currentText,
      activities: acts.length ? acts : currentActivities.map(a => a.key),
      summary: summaryText.textContent,
      savedAt: new Date().toISOString()
    };
    await window.storage.set('diary:' + iso, JSON.stringify(entry), false);
    saveBtn.textContent = 'Saved ✓';
  } catch (e) {
    saveBtn.textContent = 'Could not save';
  } finally {
    setTimeout(() => { saveBtn.disabled = false; saveBtn.textContent = 'Save This Day'; }, 1600);
  }
});
</script>
</body>
</html>
